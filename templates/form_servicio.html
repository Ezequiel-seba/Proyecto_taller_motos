{% extends "base.html" %}
{% block title %}{{ 'Editar' if reparacion else 'Nuevo' }} servicio{% endblock %}
{% block contenido %}
    <h1>{{ 'Editar' if reparacion else 'Nuevo' }} servicio</h1>
    <form method="POST">
        <label>Moto</label>
        <select name="idmotos" required>
            <option value="">-- Seleccionar moto --</option>
            {% for m in motos %}
            <option value="{{ m[0] }}" {% if reparacion and reparacion[1] == m[0] %}selected{% endif %}>
                {{ m[1] }} {{ m[2] }} - {{ m[3] }}
            </option>
            {% endfor %}
        </select>
        <label>Descripción</label>
        <textarea name="descripcion" required>{{ reparacion[2] if reparacion else '' }}</textarea>
        <label>Fecha de ingreso</label>
        <input type="date" name="fecha_ingreso" value="{{ reparacion[3] if reparacion else '' }}" required>
        <label>Fecha de salida (opcional)</label>
        <input type="date" name="fecha_salida" value="{{ reparacion[4] if reparacion and reparacion[4] else '' }}">
        <label>Costo</label>
        <input type="number" step="0.01" name="costo" value="{{ reparacion[5] if reparacion else '' }}" required>
        <label>Estado</label>
        <select name="estado" required>
            <option value="pendiente" {% if reparacion and reparacion[6] == 'pendiente' %}selected{% endif %}>Pendiente</option>
            <option value="en_proceso" {% if reparacion and reparacion[6] == 'en_proceso' %}selected{% endif %}>En proceso</option>
            <option value="finalizado" {% if reparacion and reparacion[6] == 'finalizado' %}selected{% endif %}>Finalizado</option>
        </select>
        <button type="submit">Guardar</button>
    </form>
    <a href="{{ url_for('listar_reparaciones_servicios') }}" class="volver">← Volver al listado</a>
{% endblock %}
