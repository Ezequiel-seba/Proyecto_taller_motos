{% extends "base.html" %}
{% block title %}{{ 'Editar' if moto else 'Nueva' }} moto{% endblock %}
{% block contenido %}
    <h1>{{ 'Editar' if moto else 'Nueva' }} moto</h1>
    <form method="POST">
        <label>Dueño</label>
        <select name="idclientes" required>
            <option value="">-- Seleccionar cliente --</option>
            {% for c in clientes %}
            <option value="{{ c[0] }}" {% if moto and moto[1] == c[0] %}selected{% endif %}>
                {{ c[1] }} {{ c[2] }}
            </option>
            {% endfor %}
        </select>
        <label>Marca</label>
        <input type="text" name="marca" value="{{ moto[2] if moto else '' }}" required>
        <label>Modelo</label>
        <input type="text" name="modelo" value="{{ moto[3] if moto else '' }}" required>
        <label>Patente</label>
        <input type="text" name="patente" value="{{ moto[4] if moto else '' }}" required>
        <label>Año</label>
        <input type="number" name="ano" value="{{ moto[5] if moto else '' }}">
        <button type="submit">Guardar</button>
    </form>
    <a href="{{ url_for('listar_motos') }}" class="volver">← Volver al listado</a>
{% endblock %}
