{% extends "base.html" %}
{% block title %}Clientes{% endblock %}
{% block contenido %}
    <h1>Clientes del taller</h1>
    <a href="{{ url_for('nuevo_cliente') }}" class="btn-nuevo">+ Nuevo cliente</a>
    <table>
        <tr>
            <th>Nombre</th><th>Apellido</th><th>Teléfono</th><th>Dirección</th><th>Acciones</th>
        </tr>
        {% for c in clientes %}
        <tr>
            <td>{{ c[1] }}</td>
            <td>{{ c[2] }}</td>
            <td>{{ c[3] }}</td>
            <td>{{ c[4] }}</td>
            <td>
                <a href="{{ url_for('editar_cliente', id_cliente=c[0]) }}" class="accion-editar">Editar</a>
                <a href="{{ url_for('eliminar_cliente', id_cliente=c[0]) }}" class="accion-eliminar"
                   onclick="return confirm('¿Seguro que querés eliminar este cliente?')">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
