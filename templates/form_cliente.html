{% extends "base.html" %}
{% block title %}{{ 'Editar' if cliente else 'Nuevo' }} cliente{% endblock %}
{% block contenido %}
    <h1>{{ 'Editar' if cliente else 'Nuevo' }} cliente</h1>
    <form method="POST">
        <label>Nombre</label>
        <input type="text" name="nombre" value="{{ cliente[1] if cliente else '' }}" required>
        <label>Apellido</label>
        <input type="text" name="apellido" value="{{ cliente[2] if cliente else '' }}" required>
        <label>Teléfono</label>
        <input type="text" name="telefono" value="{{ cliente[3] if cliente else '' }}" required>
        <label>Dirección</label>
        <input type="text" name="direccion" value="{{ cliente[4] if cliente else '' }}" required>
        <button type="submit">Guardar</button>
    </form>
    <a href="{{ url_for('listar_clientes') }}" class="volver">← Volver al listado</a>
{% endblock %}
